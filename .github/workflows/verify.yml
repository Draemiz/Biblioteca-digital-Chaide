name: Verify library
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsx scripts/verify-document-order.mts
      - run: npx tsx scripts/verify-category-assignment.mts
      - run: npx tsx scripts/verify-category-hierarchy.mts
      - run: npm run build:vercel
